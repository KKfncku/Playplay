<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字版贪吃蛇</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, 0.08);
      --accent: #22d3ee;
      --text: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fira Code", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
        Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: radial-gradient(circle at top left, rgba(34, 211, 238, 0.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(94, 234, 212, 0.1), transparent 30%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    main {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 4vw, 34px);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(34, 211, 238, 0.15);
      color: var(--accent);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    button:hover {
      background: rgba(34, 211, 238, 0.15);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 14px;
      color: rgba(226, 232, 240, 0.9);
    }

    .board-wrapper {
      margin-top: 12px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.25);
    }

    pre {
      margin: 0;
      padding: 16px;
      font-size: 18px;
      line-height: 1.15;
      letter-spacing: 0.02em;
      white-space: pre;
      user-select: none;
      min-height: 420px;
    }

    .message {
      margin-top: 12px;
      color: #a5f3fc;
      font-size: 14px;
    }

    .hint {
      margin-top: 16px;
      font-size: 14px;
      color: rgba(226, 232, 240, 0.8);
      line-height: 1.4;
    }

    .hint code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent);
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 14px;
      color: rgba(226, 232, 240, 0.9);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill {
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <main>
    <h1>文字版贪吃蛇 <span>浏览器无需安装</span></h1>
    <div class="toolbar">
      <button id="start-btn">开始 (Enter)</button>
      <button id="pause-btn" disabled>暂停 / 继续 (Space)</button>
      <button id="restart-btn">重新开始 (R)</button>
      <div class="stats" id="stats"></div>
    </div>
    <div class="board-wrapper">
      <pre id="board"></pre>
    </div>
    <div class="legend">
      <span><span class="pill">▓</span> 蛇身</span>
      <span><span class="pill">◎</span> 食物</span>
      <span><span class="pill">·</span> 空地</span>
      <span><span class="pill">#</span> 边界</span>
    </div>
    <div class="message" id="message">按方向键移动，吃到食物会加速哦！</div>
    <div class="hint">
      提示：支持键盘 <code>↑ ↓ ← →</code>、<code>W A S D</code> 控制方向；
      <code>Enter</code> 快速开始，<code>Space</code> 暂停/继续，<code>R</code> 重置局面。
    </div>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const restartBtn = document.getElementById('restart-btn');
    const statsEl = document.getElementById('stats');
    const messageEl = document.getElementById('message');

    const width = 24;
    const height = 18;
    const borderChar = '#';
    const emptyChar = '·';
    const snakeChar = '▓';
    const foodChar = '◎';

    const directions = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      KeyW: { x: 0, y: -1 },
      KeyS: { x: 0, y: 1 },
      KeyA: { x: -1, y: 0 },
      KeyD: { x: 1, y: 0 }
    };

    let snake = [];
    let dir = directions.ArrowRight;
    let pendingDir = dir;
    let food = { x: 0, y: 0 };
    let timer = null;
    let speed = 220;
    let running = false;
    let score = 0;
    let steps = 0;
    let best = 0;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function resetGame() {
      snake = [
        { x: 4, y: 3 },
        { x: 3, y: 3 },
        { x: 2, y: 3 }
      ];
      dir = directions.ArrowRight;
      pendingDir = dir;
      speed = 220;
      score = 0;
      steps = 0;
      running = false;
      placeFood();
      updateBoard();
      updateStats();
      messageEl.textContent = '准备开始！按 Enter 或点击“开始”。';
      pauseBtn.disabled = true;
    }

    function placeFood() {
      let x, y;
      do {
        x = rand(1, width - 2);
        y = rand(1, height - 2);
      } while (snake.some((part) => part.x === x && part.y === y));
      food = { x, y };
    }

    function updateStats() {
      best = Math.max(best, score);
      statsEl.innerHTML = `
        <span>分数：<strong>${score}</strong></span>
        <span>步数：${steps}</span>
        <span>最佳：${best}</span>
        <span>速度：${(1000 / speed).toFixed(2)}格/秒</span>
      `;
    }

    function drawCell(x, y) {
      if (x === 0 || y === 0 || x === width - 1 || y === height - 1) return borderChar;
      if (food.x === x && food.y === y) return foodChar;
      const bodyIndex = snake.findIndex((part) => part.x === x && part.y === y);
      if (bodyIndex === 0) return snakeChar;
      if (bodyIndex > -1) return snakeChar;
      return emptyChar;
    }

    function updateBoard() {
      const rows = [];
      for (let y = 0; y < height; y++) {
        const row = [];
        for (let x = 0; x < width; x++) {
          row.push(drawCell(x, y));
        }
        rows.push(row.join(' '));
      }
      boardEl.textContent = rows.join('\n');
    }

    function tick() {
      dir = pendingDir;
      const head = { ...snake[0] };
      head.x += dir.x;
      head.y += dir.y;

      if (head.x === 0 || head.x === width - 1 || head.y === 0 || head.y === height - 1) {
        endGame('撞到了边界，按 R 重来。');
        return;
      }

      if (snake.some((part) => part.x === head.x && part.y === head.y)) {
        endGame('咬到自己了，再试一次吧！');
        return;
      }

      snake.unshift(head);
      steps += 1;

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        speed = Math.max(80, speed - 8);
        placeFood();
        restartTimer();
        messageEl.textContent = '吃到食物，继续加速！';
      } else {
        snake.pop();
      }

      updateBoard();
      updateStats();
    }

    function endGame(reason) {
      running = false;
      clearInterval(timer);
      timer = null;
      pauseBtn.disabled = true;
      messageEl.textContent = `游戏结束：${reason}`;
    }

    function restartTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(tick, speed);
    }

    function startGame() {
      if (running) return;
      running = true;
      messageEl.textContent = '游戏进行中，注意避开自己！';
      pauseBtn.disabled = false;
      restartTimer();
    }

    function togglePause() {
      if (!running) return;
      if (timer) {
        clearInterval(timer);
        timer = null;
        messageEl.textContent = '已暂停，按空格继续。';
        pauseBtn.textContent = '继续 (Space)';
      } else {
        restartTimer();
        messageEl.textContent = '继续前进！';
        pauseBtn.textContent = '暂停 (Space)';
      }
    }

    function handleKey(e) {
      if (directions[e.code]) {
        const next = directions[e.code];
        const opposite = dir.x + next.x === 0 && dir.y + next.y === 0;
        if (!opposite) {
          pendingDir = next;
        }
      }

      if (e.code === 'Enter') startGame();
      if (e.code === 'Space') {
        e.preventDefault();
        togglePause();
      }
      if (e.code === 'KeyR') {
        e.preventDefault();
        resetGame();
      }
    }

    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetGame);
    document.addEventListener('keydown', handleKey);

    resetGame();
  </script>
</body>
</html>
